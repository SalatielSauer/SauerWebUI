joylooksens 2.5
// 'x'
controllerbind "CONTROLLER_A" [
	if $editing [
		if $havesel [
			editextend
		] [
			editdrag
		]
	] [
		jump
	]
]
// 'circle'		
controllerbind "CONTROLLER_B" [
	if $editing [
		if $havesel [
			cancelsel
		]
	]
]
// 'square'
controllerbind "CONTROLLER_X" []
// 'triangle'
controllerbind "CONTROLLER_Y" []
// 'select'
controllerbind "CONTROLLER_BACK" [
	if (getmode m_edit) [
		edittoggle
	]
]
// the center ball
controllerbind "CONTROLLER_GUIDE" []
// 'start'
controllerbind "CONTROLLER_START" [
	if $editing [
		showtexgui
	] [
		togglemainmenu
	]
]
// 'L1'
controllerbind "CONTROLLER_LEFTSHOULDER" [
	if $editing [
		if $havesel [
			if (!=s (getseltex) "") [
				editdel
			] [
				universaldelta 1
			]
		]
	]
]
// 'R1'
controllerbind "CONTROLLER_RIGHTSHOULDER" [
	if $editing [
		if $havesel [
			universaldelta -1
		]
	] [
		attack
	]
]
// 'L2'
controllerbind "CONTROLLER_TRIGGERLEFT" []
// 'R2'
controllerbind "CONTROLLER_TRIGGERRIGHT" [
	if $editing [
		floatspeed (max 100 (divf $arg1 20))
	]
]
// 'L3'
controllerbind "CONTROLLER_LEFTSTICK" []
// 'R3'
controllerbind "CONTROLLER_RIGHTSTICK" []
//
controllerbind "CONTROLLER_DPAD_UP" []
//
controllerbind "CONTROLLER_DPAD_DOWN" []
//
controllerbind "CONTROLLER_DPAD_LEFT" []
//
controllerbind "CONTROLLER_DPAD_RIGHT" []