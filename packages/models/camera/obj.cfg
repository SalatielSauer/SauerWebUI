objload "model.obj"
objskin "cam-detail1" 	"<mad:0.0374/0.0374/0.0374>skin.png"
objskin "cam-detail2" 	"<mad:0.0204/0.0204/0.0204>skin.png"
objskin "cam-detail3" 	"<mad:0.0374/0.0374/0.0374>skin.png"
objskin "cam-body" 		"<mad:0.1329/0.1329/0.1329>skin.png"
objskin "cam-lens1" 	"<mad:0.0766/0.0766/0.0766>skin.png"
objskin "cam-lens2" 	"<mad:0/0/0>skin.png"
objskin "cam-lens3" 	"<mad:1.0/0.9404/0.9404>skin.png"
objskin "cam-neck" 		"<mad:0.0374/0.0374/0.0374>skin.png"
objskin "cam-mic1" 		"<mad:0.0766/0.0766/0.0766>skin.png"
objskin "cam-mic2" 		"<mad:0.0204/0.0204/0.0204>skin.png"
objskin "cam-watcher1" 	"<mad:0.0374/0.0374/0.0374>skin.png"
objskin "cam-watcher2" 	"<mad:0.281/0.281/0.281>skin.png"
objskin "cam-light" 	"skin.png" //<mad:0.8/0.0768/0.0461>
objskin "text_record"	"<mad:0/0/0>skin.png"
objskin "text_pause" 	"<mad:0/0/0>skin.png"
objskin "text_play"		"<mad:0/0/0>skin.png"

objfullbright "cam-mic2" 1
objfullbright "cam-light" 1

objalphatest * 0

looplist m ["cam-mic1" "cam-mic2" "text_record" "text_pause" "text_play"] [
	objalphablend $m 0
]

mdlscale 1000
mdlcollide 0

_cutscenecam_shader = [
	shader 0 [cutscenecam_@arg1@getmillis] [
		attribute vec4 vvertex, vcolor;
		attribute vec2 vtexcoord0;
		varying vec2 texcoord0;
		varying vec4 color;
		uniform mat4 modelmatrix;
		uniform int cutscenestate;
		varying vec4 custompos;

	    void main(void)
	    {
	    	@arg3
	        gl_Position = modelmatrix * (vvertex + custompos);
	        texcoord0 = vtexcoord0;
	        color = vcolor;
	    }
	] [
		uniform sampler2D diffusemap;
		varying vec2 texcoord0;
		varying vec4 color;
		uniform float millis;
		uniform int cutscenestate;
		vec4 diffuse = texture2D(diffusemap, texcoord0);

		void main(void)
		{
			@arg2
		}
	]
]

_cutscenecam_shader "blink" [
	float blink = (sin(millis * 8.0) + 1.0) * 0.5;
	vec4 outColor = vec4(0.2, 0.2, 0.2, 1); // default: grey
	if (cutscenestate == 1) {
		outColor = mix(diffuse * 0.3, vec4(1, 0, 0, 1), blink); // recording: blink red
	} else if (cutscenestate == 2) {
		outColor = vec4(1, 1, 0, 1); // paused: steady yellow
	} else if (cutscenestate == 3) {
		outColor = vec4(0, 1, 0, 1); // playing: steady green
	}
	outColor.w = 1;
	gl_FragColor = outColor;
]

_cutscenecam_shader "blink2" [
	float blink = (sin(millis * 8.0) + 1.0) * 0.5;
	vec4 outColor = vec4(0.2, 0.2, 0.2, 1); // default: grey
	if (cutscenestate == 1) {
		outColor = mix(diffuse * 0.3, vec4(0, 1, 0, 1), blink); // recording: blink green

	} else if (cutscenestate == 2) {
		outColor = vec4(1, 0, 0, 1); // paused: steady red
	} else if (cutscenestate == 3) {
		outColor = mix(diffuse * 0.3, vec4(0, 0, 1, 1), blink); // playing: steady blue
	}
	outColor.w = 1;
	gl_FragColor = outColor;
]

loop i 3 [
	local state
	state = (at ["record" "pause" "play"] $i)
	_cutscenecam_shader $state [
		gl_FragColor = vec4(0, 0, 1, 1);
	] [
		if (cutscenestate == @(+ $i 1)) {
			custompos.x += 0.05;
		}
	]
	objshader [text_@state] [cutscenecam_@state@getmillis]
]

objshader "cam-lens2" [cutscenecam_blink@getmillis]
objshader "cam-light" [cutscenecam_blink2@getmillis]